name: Publish

on:
  push:
    tags:
      - "v*"
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v3.0.1)"
        required: true
        default: "v3.0.1"

permissions:
  contents: read

jobs:
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#sdk-}"
          VERSION="${VERSION#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version consistency
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          expected = os.environ["EXPECTED_VERSION"]
          pyproj = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          native_pyproj = tomllib.loads(Path("native/pkt_core_native/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          native_cargo = tomllib.loads(Path("native/pkt_core_native/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          init_src = Path("src/pkt_core/__init__.py").read_text(encoding="utf-8")
          assert pyproj == expected, f"pyproject.toml version {pyproj!r} != tag {expected!r}"
          assert native_pyproj == expected, f"native pyproject.toml version {native_pyproj!r} != tag {expected!r}"
          assert native_cargo == expected, f"native Cargo.toml version {native_cargo!r} != tag {expected!r}"
          assert f'__version__ = "{expected}"' in init_src, f"src/pkt_core/__init__.py does not declare __version__ = {expected!r}"
          print(f"All package versions match {expected}")
          PY

      - name: Build and verify wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag and version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#sdk-}"
          VERSION="${VERSION#v}"
          REPO="${GITHUB_REPOSITORY,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${REPO}:${VERSION}"
            if [ "$EVENT_NAME" = "push" ]; then
              echo "ghcr.io/${REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
