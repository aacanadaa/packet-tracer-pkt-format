# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The contract: tests pass, types are strict, coverage holds at 90%.
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented floor; 3.14 is what we develop against.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Test tooling only. Runtime dependencies must come from `pip install -e .`
          # -- listing them here as well would mask a missing entry in pyproject,
          # which is exactly how the undeclared pydantic dependency shipped (see #2).
          pip install -e . pytest pytest-cov hypothesis mypy

      - name: Types (mypy --strict)
        run: python -m mypy --strict src/pkt_core

      - name: Tests + coverage gate
        run: >
          python -m pytest tests/
          -p no:cacheprovider
          --cov=pkt_core
          --cov-report=term-missing

      # The pure-Python path must stand on its own: if the optional Rust
      # module were somehow present on the runner, mask it and re-run.
      - name: Tests with the Rust accelerator masked
        env:
          PKT_CORE_DISABLE_RUST: "1"
        run: python -m pytest tests/ -p no:cacheprovider

  # Windows is a supported target for the Python package, and it was the one that
  # went untested: Ubuntu-only CI is what let an import-time libgcrypt dependency
  # break collection for the whole suite on Windows. Coverage is measured by the
  # Linux jobs, so this one runs the suite without the coverage gate.
  windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest hypothesis mypy

      - name: Types (mypy --strict)
        run: python -m mypy --strict src/pkt_core

      - name: Tests
        run: python -m pytest tests/ -p no:cacheprovider

  # The accelerator is verified here, on Linux only, and that is deliberate. It is
  # optional, and it is not published as a wheel (the crate sets publish = false),
  # so it is built from source by whoever wants it; a per-platform matrix would
  # test a build nobody consumes. `abi3-py310` keeps that source build portable,
  # and native/pkt_core_native/README.md documents the Windows build.
  rust:
    name: rust accelerator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Native KATs
        working-directory: native/pkt_core_native
        run: |
          cargo test --no-default-features

      - name: Install pkt_core and the extension
        run: |
          python -m pip install --upgrade pip
          # Build and test tooling only; runtime dependencies come from
          # `pip install -e .`, the same rule as the test job above (see #2).
          pip install maturin pytest pytest-cov hypothesis mypy
          python -m pip install -e .
          # the crate's pyproject declares build-backend = "maturin", so pip
          # builds and installs it into this interpreter directly
          pip install --no-build-isolation ./native/pkt_core_native

      # Fail here, legibly, rather than inside a test with a confusing message.
      - name: Sanity - the extension imports and the backend registers
        run: |
          python -c "import pkt_core_native as n; print('pkt_core_native', n.__version__)"
          python -c "from pkt_core.crypto.ciphers import available_backends, rust_available; print('backends', available_backends()); assert rust_available(), 'Rust backend did not register'"

      - name: Cross-backend equivalence (Rust == pure Python)
        # No PKT_CORE_BACKEND here: the tests pin backends where they need
        # them, and forcing it globally would break the optionality check.
        run: python -m pytest tests/test_rust_backend.py tests/test_ciphers.py -p no:cacheprovider

      - name: Full suite with the accelerator
        run: python -m pytest tests/ -p no:cacheprovider
